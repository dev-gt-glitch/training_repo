
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Induvadana</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/signup.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="../index.html" class="logo-circle">
            <img src="../Images/logo.svg" alt="Induvadana home">
        </a>

        <nav class="navbar" aria-label="Main navigation">
            <a href="../index.html">Home</a>
            <a href="Login.html">Login</a>
        </nav>
    </header>

    <main class="signup-main">
        <section class="signup-card" aria-labelledby="signup-heading">
            <h1 id="signup-heading">Create your account</h1>
            <p>Join Induvadana and find your perfect stay.</p>

            <form id="signup-form">
                <div class="form-group">
                    <label for="full-name">Full name</label>
                    <input
                        type="text"
                        id="full-name"
                        name="fullName"
                        autocomplete="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        minlength="8"
                        aria-describedby="password-help"
                        placeholder="Create a password"
                        required
                    >
                    <small id="password-help">
                        Use at least 8 characters.
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        autocomplete="new-password"
                        aria-describedby="confirm-error"
                        placeholder="Re-enter your password"
                        required
                    >
                    <small
                        id="confirm-error"
                        class="field-error"
                        aria-live="polite"
                    ></small>
                </div>

                <button type="submit" class="signup-button">
                    Create account
                </button>

                <p id="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Induvadana</p>
    </footer>
</body>
</html>
