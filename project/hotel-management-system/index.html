
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Induvadana</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo-circle">
            <img src="Images/logo.svg" alt="Induvadana home">
        </a>

        <nav class="navbar" aria-label="Main navigation">
            <a href="pages/login.html">Login</a>
            <a href="pages/signup.html">Sign Up</a>
        </nav>
    </header>

    <main>
        <section aria-labelledby="welcome-heading">
            <h1 id="welcome-heading" class="title">
                Welcome to Induvadana
            </h1>

            <p class="subtitle">
                A vibrant, luxurious and safe haven.
            </p>
        </section>

        <section class="hotels-section" aria-labelledby="hotels-heading">
            <h2 id="hotels-heading">Featured Hotels</h2>

            <div class="hotel-grid">
            <article class="hotel-card">
                <img
                    class="hotel-card-image"
                    src="Images/hotels/green-valley-hotel.jpg"
                    alt="Elegant hotel building surrounded by greenery"
                    loading="lazy"
                >
                <div class="hotel-card-content">
                <h3>Green Valley Hotel</h3>
                <p>A peaceful stay surrounded by nature.</p>
                </div>
            </article>

            <article class="hotel-card">
                <img
                    class="hotel-card-image"
                    src="Images/hotels/royal-palace.jpg"
                    alt="Luxurious hotel room with a large bed and seating area"
                    loading="lazy"
                >
                <div class="hotel-card-content">
                <h3>Royal Palace</h3>
                <p>Experience comfort and luxury.</p>
                </div>
            </article>

            <article class="hotel-card">
                <img
                    class="hotel-card-image"
                    src="Images/hotels/city-view-hotel.jpg"
                    alt="Modern hotel interior with a city view"
                    loading="lazy"
                >
                <div class="hotel-card-content">
                <h3>City View Hotel</h3>
                <p>Stay close to the city centre.</p>
                </div>
            </article>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Induvadana</p>
    </footer>
</body>
</html>
